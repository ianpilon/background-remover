<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Background Remover</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #16181d;
    --panel-2: #1d2027;
    --border: #2a2e37;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #7c5cff;
    --accent-2: #5b8def;
    --ok: #34d399;
    --err: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  .row label { font-size: 13px; color: var(--muted); }
  select, button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .drop {
    border: 2px dashed var(--border); border-radius: 14px; padding: 56px 24px;
    text-align: center; background: var(--panel); transition: 0.15s ease;
    cursor: pointer;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--panel-2); }
  .drop p { margin: 0; color: var(--muted); }
  .drop strong { color: var(--text); }
  .status { margin: 16px 0; font-size: 13px; color: var(--muted); min-height: 20px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  .bar { width: 100%; height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0; transition: width 0.2s; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .card .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  .card .imgs > div { background: var(--panel); padding: 8px; }
  .card .imgs .tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .card img { display: block; width: 100%; height: 200px; object-fit: contain; border-radius: 6px; }
  .checker {
    background-image:
      linear-gradient(45deg, #2a2e37 25%, transparent 25%),
      linear-gradient(-45deg, #2a2e37 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2e37 75%),
      linear-gradient(-45deg, transparent 75%, #2a2e37 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, 8px 0;
  }
  .card .actions { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); align-items: center; }
  .card .name { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .actions a {
    background: var(--accent); color: white; text-decoration: none;
    padding: 6px 12px; border-radius: 6px; font-size: 13px;
  }
  .card .actions a:hover { background: var(--accent-2); }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; text-align: center; }
  code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Background Remover</h1>
  <p class="sub">Runs entirely in your browser. Images never leave your machine.</p>

  <div class="row">
    <label for="model">Model:</label>
    <select id="model">
      <option value="isnet_fp16" selected>ISNet fp16 (recommended, ~40MB)</option>
      <option value="isnet">ISNet full precision (~80MB, slowest, highest quality)</option>
      <option value="isnet_quint8">ISNet quantized (~20MB, fastest, lower quality)</option>
    </select>
    <button id="clear" type="button">Clear results</button>
  </div>

  <div id="drop" class="drop" tabindex="0">
    <p><strong>Drop images here</strong>, or click to choose</p>
    <p style="font-size:12px;margin-top:6px;">PNG, JPG, WEBP. Multiple at once is fine.</p>
    <input type="file" id="file" accept="image/*" multiple hidden />
  </div>

  <div id="status" class="status"></div>
  <div id="bar" class="bar" style="display:none;"><span></span></div>

  <div id="results" class="grid"></div>

  <footer>
    First run downloads the model (cached after). Powered by <code>@imgly/background-removal</code>.
  </footer>
</main>

<script type="module">
  import * as bgr from "https://esm.sh/@imgly/background-removal@1?bundle";
  const removeBackground = bgr.removeBackground ?? bgr.default;
  if (typeof removeBackground !== "function") {
    document.getElementById("status").textContent =
      "Failed to load background removal library. Check your internet connection and reload.";
    document.getElementById("status").className = "status err";
  }

  const drop = document.getElementById("drop");
  const file = document.getElementById("file");
  const status = document.getElementById("status");
  const bar = document.getElementById("bar");
  const barFill = bar.querySelector("span");
  const results = document.getElementById("results");
  const modelSel = document.getElementById("model");
  const clearBtn = document.getElementById("clear");

  function setStatus(msg, kind = "") {
    status.textContent = msg;
    status.className = "status " + kind;
  }
  function setProgress(pct) {
    if (pct == null) { bar.style.display = "none"; return; }
    bar.style.display = "block";
    barFill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  }

  drop.addEventListener("click", () => file.click());
  drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") file.click(); });
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
    if (files.length) processFiles(files);
  });
  file.addEventListener("change", () => {
    if (file.files.length) processFiles([...file.files]);
    file.value = "";
  });

  clearBtn.addEventListener("click", () => {
    [...results.querySelectorAll("img")].forEach(img => URL.revokeObjectURL(img.src));
    results.innerHTML = "";
    setStatus("");
    setProgress(null);
  });

  async function processFiles(files) {
    const model = modelSel.value;
    setStatus(`Processing ${files.length} image${files.length > 1 ? "s" : ""}…`);
    setProgress(0);

    const config = {
      model,
      output: { format: "image/png", quality: 1.0 },
      progress: (key, current, total) => {
        const pct = total ? (current / total) * 100 : 0;
        if (key.startsWith("fetch")) setStatus(`Downloading model: ${key}`);
        else if (key.startsWith("compute")) setStatus(`Removing background…`);
        setProgress(pct);
      },
    };

    let done = 0;
    for (const f of files) {
      try {
        const blob = await removeBackground(f, config);
        addResult(f, blob);
        done++;
        setStatus(`Done: ${done} of ${files.length}`, "ok");
      } catch (err) {
        console.error(err);
        setStatus(`Error on ${f.name}: ${err.message || err}`, "err");
      }
    }
    setProgress(null);
  }

  function addResult(originalFile, resultBlob) {
    const card = document.createElement("div");
    card.className = "card";

    const origUrl = URL.createObjectURL(originalFile);
    const outUrl = URL.createObjectURL(resultBlob);
    const outName = originalFile.name.replace(/\.[^.]+$/, "") + "-nobg.png";

    card.innerHTML = `
      <div class="imgs">
        <div>
          <div class="tag">Original</div>
          <img src="${origUrl}" alt="original" />
        </div>
        <div>
          <div class="tag">Transparent</div>
          <img class="checker" src="${outUrl}" alt="result" />
        </div>
      </div>
      <div class="actions">
        <span class="name">${outName}</span>
        <a href="${outUrl}" download="${outName}">Download</a>
      </div>
    `;
    results.prepend(card);
  }

  setStatus("Ready. Drop an image to start.");
</script>
</body>
</html>
